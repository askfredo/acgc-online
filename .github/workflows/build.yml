name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # attach builds to releases on tags

jobs:
  server:
    name: Town server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go test ./...
        working-directory: server

  windows:
    name: Windows (32-bit)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: No symlinks on checkout
        shell: bash
        run: git config --global core.symlinks false
      - uses: actions/checkout@v4
      - name: Case-only symlink
        # include/PowerPC_EABI_Support/msl -> Msl: on Windows both names are the same
        # folder, so the symlink (checked out as a text file) only hides the real one.
        shell: bash
        run: |
          if [ ! -d include/PowerPC_EABI_Support/Msl/MSL_C ]; then
            rm -f include/PowerPC_EABI_Support/msl
            git checkout -- include/PowerPC_EABI_Support/Msl
          fi
          ls include/PowerPC_EABI_Support/Msl/MSL_C/PPC_EABI/cmath_gcn.h
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-make
            mingw-w64-i686-SDL2
            mingw-w64-i686-pkgconf
            python
            zip
      - name: N64 SDK headers
        run: python tools/fetch_n64_headers.py
      - name: Configure
        run: cmake -S pc -B pc/build32 -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build pc/build32 -j4
      - name: Package
        run: |
          D=dist/ACGC-Online
          mkdir -p $D/rom
          cp pc/build32/bin/AnimalCrossing.exe pc/build32/bin/SDL2.dll pc/build32/bin/cacert.pem $D/
          cp -r pc/build32/bin/shaders pc/build32/bin/fonts $D/
          cp docs/PLAYING.txt $D/README.txt
          cp LICENSE $D/
          (cd dist && zip -r ../ACGC-Online-windows.zip ACGC-Online)
      - uses: actions/upload-artifact@v4
        with:
          name: ACGC-Online-windows
          path: ACGC-Online-windows.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ACGC-Online-windows.zip

  linux:
    name: Linux (32-bit)
    runs-on: ubuntu-24.04
    # Ubuntu's i386 SDL2 packages clash with the runner's 64-bit ones now and then;
    # don't let that hold back the Windows release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          # The runner's 64-bit glib dev packages block their 32-bit twins that SDL2 pulls in.
          sudo apt-get remove -y libglib2.0-dev libglib2.0-dev-bin || true
          sudo apt-get install -y gcc-14-multilib g++-14-multilib cmake libsdl2-dev:i386
          # The decomp's audio code uses std::sinf and friends (libstdc++ 14+).
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
      - name: N64 SDK headers
        run: python3 tools/fetch_n64_headers.py
      - name: Configure
        run: |
          PKG_CONFIG_LIBDIR=/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig \
          cmake -S pc -B pc/build32 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$PWD/pc/cmake/Toolchain-linux32-multilib.cmake
      - name: Build
        run: cmake --build pc/build32 -j4
      - name: Package
        run: |
          D=dist/ACGC-Online
          mkdir -p $D/rom
          cp pc/build32/bin/AnimalCrossing pc/build32/bin/cacert.pem $D/
          cp -r pc/build32/bin/shaders pc/build32/bin/fonts $D/
          cp docs/PLAYING.txt $D/README.txt
          cp LICENSE $D/
          tar -C dist -czf ACGC-Online-linux.tar.gz ACGC-Online
      - uses: actions/upload-artifact@v4
        with:
          name: ACGC-Online-linux
          path: ACGC-Online-linux.tar.gz
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ACGC-Online-linux.tar.gz
